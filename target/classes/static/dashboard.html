<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLens AI - Dashboard</title>
    <link rel="stylesheet" href="app.css">
    <style>
        .stat-number {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            margin-top: 1rem;
        }
        .table-card {
            padding: 1.5rem;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            padding: 1.25rem 1rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
        }
        tbody tr {
            transition: var(--transition);
        }
        tbody tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .header-title {
            margin-bottom: 2rem;
            font-size: 2.25rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="/dashboard.html" class="logo">CodeLens AI</a>
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/review.html" class="btn" style="margin-left: 1.5rem;">New Review</a>
            <a href="#" id="logout-btn" style="margin-left: 1.5rem;">Logout</a>
        </div>
    </header>

    <div class="container fade-in">
        <h2 class="header-title text-gradient">Dashboard Overview</h2>
        
        <div class="grid" style="margin-bottom: 3rem;">
            <div class="card glass text-center" style="text-align: center;">
                <h3 style="color: var(--text-secondary); margin: 0; font-weight: 500;">Total Reviews</h3>
                <div id="stat-total" class="stat-number text-gradient">-</div>
            </div>
            <div class="card glass text-center" style="text-align: center;">
                <h3 style="color: var(--text-secondary); margin: 0; font-weight: 500;">Issues Found</h3>
                <div id="stat-issues" class="stat-number" style="color: var(--info);">-</div>
            </div>
            <div class="card glass text-center" style="text-align: center;">
                <h3 style="color: var(--text-secondary); margin: 0; font-weight: 500;">High Severity</h3>
                <div id="stat-high" class="stat-number" style="color: var(--warning);">-</div>
            </div>
            <div class="card glass text-center" style="text-align: center;">
                <h3 style="color: var(--text-secondary); margin: 0; font-weight: 500;">Critical Severity</h3>
                <div id="stat-critical" class="stat-number" style="color: var(--danger);">-</div>
            </div>
        </div>

        <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Recent Reviews</h3>
        <div class="card glass table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Language</th>
                        <th>Date</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="recent-reviews">
                    <tr><td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-secondary);">Loading stats...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!isAuthenticated()) return;

            try {
                const stats = await apiRequest('/dashboard');
                
                // Animate numbers (simple implementation)
                document.getElementById('stat-total').innerText = stats.totalReviews;
                document.getElementById('stat-issues').innerText = stats.issuesFound;
                document.getElementById('stat-high').innerText = stats.highIssues;
                document.getElementById('stat-critical').innerText = stats.criticalIssues;

                const tbody = document.getElementById('recent-reviews');
                if (stats.recentReviews.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No reviews yet. Start a New Review!</td></tr>';
                } else {
                    tbody.innerHTML = stats.recentReviews.map(r => `
                        <tr>
                            <td style="font-family: monospace; color: var(--text-secondary);">#${r.id}</td>
                            <td>
                                <span class="badge" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--text-primary); text-transform: capitalize;">
                                    ${r.language}
                                </span>
                            </td>
                            <td style="color: var(--text-secondary);">${r.date}</td>
                            <td style="text-align: right;">
                                <a href="/result.html?id=${r.id}" class="btn" style="padding: 0.4rem 1rem; font-size: 0.85rem;">View Report</a>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error('Failed to load dashboard', e);
            }
        });
    </script>
</body>
</html>
