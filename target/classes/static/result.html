<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLens AI - Review Result</title>
    <link rel="stylesheet" href="app.css">
    <style>
        .summary-header {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: var(--text-primary);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        .stat-box .count {
            font-size: 2.5rem;
            font-weight: 700;
            display: block;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <a href="/dashboard.html" class="logo">CodeLens AI</a>
        <div class="nav-links">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/review.html" class="btn" style="margin-left: 1.5rem;">New Review</a>
            <a href="#" id="logout-btn" style="margin-left: 1.5rem;">Logout</a>
        </div>
    </header>

    <div class="container fade-in" id="content" style="display: none;">
        <h2 class="text-gradient" style="font-size: 2.25rem; margin-bottom: 1.5rem;">Review Analysis Report</h2>
        
        <div class="card glass" style="margin-bottom: 2rem;">
            <p id="summary-text" class="summary-header"></p>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <span style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">Critical</span>
                    <span id="count-critical" class="count" style="color: var(--danger);">0</span>
                </div>
                <div class="stat-box">
                    <span style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">High</span>
                    <span id="count-high" class="count" style="color: var(--warning);">0</span>
                </div>
                <div class="stat-box">
                    <span style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">Medium</span>
                    <span id="count-medium" class="count" style="color: var(--info);">0</span>
                </div>
                <div class="stat-box">
                    <span style="color: var(--text-secondary); text-transform: uppercase; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;">Low</span>
                    <span id="count-low" class="count" style="color: var(--text-secondary);">0</span>
                </div>
            </div>
        </div>

        <h2 style="font-size: 1.8rem; margin-bottom: 1rem; color: var(--text-primary);">Identified Issues</h2>
        <div class="card glass" id="issues-container" style="padding: 1.5rem; margin-bottom: 2rem;">
            <!-- Issues injected here -->
        </div>

        <div id="improvement-section" class="hidden">
            <h2 class="text-gradient" style="font-size: 1.8rem; margin-bottom: 1rem;">Suggested Improvements</h2>
            <div class="card glass" style="margin-bottom: 2rem; padding: 2rem;">
                <p id="improvement-explanation" style="margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 1.05rem; line-height: 1.6;"></p>
                <div class="code-block" id="improved-code"></div>
            </div>
        </div>
        
        <h2 style="font-size: 1.8rem; margin-bottom: 1rem; color: var(--text-primary);">Original Source Code</h2>
        <div class="card glass" style="padding: 2rem;">
            <div class="code-block" id="original-code" style="opacity: 0.8;"></div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!isAuthenticated()) return;

            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                window.location.href = '/dashboard.html';
                return;
            }

            try {
                const review = await apiRequest(`/reviews/${id}`);
                
                document.getElementById('summary-text').innerText = review.summary;
                document.getElementById('original-code').innerText = review.sourceCode;
                
                let critical = 0, high = 0, medium = 0, low = 0;
                
                const issuesHtml = review.issues.map(i => {
                    const sev = i.severity.toLowerCase();
                    if (sev === 'critical') critical++;
                    else if (sev === 'high') high++;
                    else if (sev === 'medium') medium++;
                    else low++;

                    return `
                    <div class="issue-item severity-${i.severity}">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                            <strong style="font-size: 1.1rem; color: var(--text-primary);">${i.title}</strong>
                            <span class="badge badge-${sev}" style="text-transform: capitalize;">${i.severity}</span>
                        </div>
                        <div style="display: flex; gap: 1rem; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem; font-weight: 500;">
                            <span style="background: rgba(255,255,255,0.05); padding: 0.25rem 0.5rem; border-radius: 4px;">Category: ${i.category}</span>
                            <span style="background: rgba(255,255,255,0.05); padding: 0.25rem 0.5rem; border-radius: 4px;">Line: ${i.lineNumber || 'N/A'}</span>
                        </div>
                        <p style="margin: 0.75rem 0; color: var(--text-primary); line-height: 1.5;">${i.description}</p>
                        <div style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; margin-top: 1rem;">
                            <p style="margin: 0 0 0.5rem 0; font-size: 0.95rem;"><strong style="color: var(--accent-primary);">Explanation:</strong> <span style="color: var(--text-secondary);">${i.explanation}</span></p>
                            <p style="margin: 0; font-size: 0.95rem;"><strong style="color: var(--success);">Suggested Fix:</strong> <span style="color: var(--text-primary);">${i.suggestedFix}</span></p>
                        </div>
                    </div>`;
                }).join('');

                document.getElementById('count-critical').innerText = critical;
                document.getElementById('count-high').innerText = high;
                document.getElementById('count-medium').innerText = medium;
                document.getElementById('count-low').innerText = low;

                if (review.issues.length === 0) {
                    document.getElementById('issues-container').innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            <p style="color: var(--success); font-size: 1.2rem; margin: 0; font-weight: 500;">Outstanding! No issues found.</p>
                        </div>
                    `;
                } else {
                    document.getElementById('issues-container').innerHTML = issuesHtml;
                }

                if (review.improvement) {
                    document.getElementById('improvement-section').classList.remove('hidden');
                    document.getElementById('improvement-explanation').innerText = review.improvement.explanation;
                    document.getElementById('improved-code').innerText = review.improvement.improvedCode;
                }

                document.getElementById('content').style.display = 'block';

            } catch (e) {
                alert("Failed to load review: " + e.message);
            }
        });
    </script>
</body>
</html>
